name: Check for stale status updates

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # manual trigger

jobs:
  stale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check status-<machine> branches for stale <exp>.json files
        id: check
        run: |
          stale_files=""
          now=$(date +%s)

          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/status-*'); do
            branch="${ref#origin/}"
            machine="${branch#status-}"

            for f in $(git ls-tree --name-only "$ref" | grep -E '^[^/_][^/]*\.json$' || true); do
              content=$(git show "${ref}:${f}" 2>/dev/null || true)
              [[ -z "$content" ]] && continue

              updated=$(echo "$content" | jq -r '.updated_at // empty' 2>/dev/null)
              if [[ -z "$updated" ]]; then
                echo "::warning::${branch}/${f} has no updated_at field"
                continue
              fi

              is_completed=$(echo "$content" | jq -r '.retro_completed_at // empty' 2>/dev/null)
              if [[ -n "$is_completed" ]]; then
                echo "::info::${branch}/${f} is a completed retrospective experiment (${is_completed}). Skipping staleness check."
                continue
              fi

              file_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
              age_min=$(( (now - file_epoch) / 60 ))

              if [ $age_min -gt 30 ]; then
                echo "::error::${branch}/${f} is ${age_min} minutes stale (last updated: $updated)"
                exp=$(echo "$content" | jq -r '.experiment // "'"${f%.json}"'"')
                cluster=$(echo "$content" | jq -r '.cluster // "'"${machine}"'"')
                stale_files="${stale_files}${exp} on ${cluster} [${branch}/${f}] (${age_min}m stale)\n"
              fi
            done
          done

          if [[ -n "$stale_files" ]]; then
            echo "STALE=true" >> $GITHUB_OUTPUT
            {
              echo "STALE_INFO<<EOF"
              echo -e "$stale_files"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create issue on stale status
        if: steps.check.outputs.STALE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const staleInfo = `${{ steps.check.outputs.STALE_INFO }}`;
            const title = `⚠️ Stale workflow status detected - ${new Date().toISOString().slice(0,16)}`;
            const body = `## Stale Status Files Detected\n\nThe following experiments have not updated their status in over 30 minutes:\n\n\`\`\`\n${staleInfo}\`\`\`\n\nThis may indicate:\n- The monitoring script on the HPC is not running\n- The HPC system is down\n- Network connectivity issues\n\nPlease investigate.`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-status'
            });

            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['stale-status']
              });
            }
